name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml builds a tag the same way before drafting the release.
  workflow_call:
    inputs:
      ref:
        description: The ref to build (release.yml passes the tag); the triggering ref when empty
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The app reports this version and names its files with it, so a release tag must match.
      - name: Check the tag matches package.json
        if: startsWith(inputs.ref || github.ref, 'refs/tags/v')
        shell: bash
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          tag="${REF#refs/tags/}"
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag $tag doesn't match package.json version $version. Tag with npm version instead."
            exit 1
          fi
      - run: npm ci
      # Typecheck + bundle, then package. Unsigned until a code-signing certificate is set up.
      - run: npm run ${{ matrix.dist }}
      - uses: actions/upload-artifact@v7
        with:
          name: lithos-launcher-${{ matrix.os }}
          path: |
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
          if-no-files-found: error
